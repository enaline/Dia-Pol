<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Outputs | Diapols</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="vendor/ldavis.v1.0.0.css">
</head>
<body>
<a class="skip-link" href="#content">Skip to content</a>
<header class="site-header">
<div class="wrap wide">
<p class="site-title"><a href="../">Diapols</a></p>
<nav aria-label="Main"><ul><li><a href="../">Dia-Pol</a></li><li><a href="../team/">Project Team</a></li><li><a href="../project-outputs/" aria-current="page">Project Outputs</a></li><li><a href="../conferences/">Conferences</a></li><li><a href="../contact/">Contact</a></li></ul></nav>
</div>
</header>
<main id="content" class="wrap wide">
<h1 class="entry-title">Project Outputs</h1>
<form id="output-form" class="output-form">
<div><label for="dataset">Dataset:</label>
<select id="dataset"><option value="1">Black Lives Matter</option><option value="2" selected>MeToo</option></select></div>
<div><label for="resulttype">Type:</label>
<select id="resulttype"><option value="t" selected>Topic modeling</option><option value="n">N-gram</option></select></div>
<div id="ngramdiv" hidden><label for="ngram">N-Grams:</label>
<select id="ngram"><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
<div id="themecountdiv"><label for="themecount">Number of Topics:</label>
<select id="themecount"><option>5</option><option>10</option><option>15</option><option>20</option></select></div>
<div><label for="period">Period:</label>
<select id="period"><option value="A" selected>All Time</option><option value="Y">Year</option><option value="M">Month</option></select></div>
<div id="yeardiv" hidden><label for="year">Year:</label>
<select id="year"><option>2020</option><option>2021</option></select></div>
<div id="monthdiv" hidden><label for="month">Month:</label>
<select id="month"><option value="1">January</option><option value="2">February</option><option value="3">March</option><option value="4">April</option><option value="5">May</option><option value="6">June</option><option value="7">July</option><option value="8">August</option><option value="9">September</option><option value="10">October</option><option value="11">November</option><option value="12">December</option></select></div>
<button type="submit">Submit</button>
</form>
<div id="response" aria-live="polite"></div>
</main>
<footer class="site-footer"><div class="wrap wide">Diapols</div></footer>
<script src="vendor/d3.v5.min.js"></script>
<script src="vendor/ldavis.v3.0.0.js"></script>
<script src="outputs.js"></script>
</body>
</html>
